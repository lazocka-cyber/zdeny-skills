<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<title>Paloma – Live muziek met Filip & Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{--cream:#f4e7cf;--gold:#e0b25a;--wine:#7a1f1f;--olive:#2f4a33;--bg:#1a0d08}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(ellipse at 70% 20%,#5a2a14 0%,#2a120a 55%,#120805 100%);
  font-family:Georgia,'Times New Roman',serif;color:var(--cream)}
.abs{position:absolute}
#photo{left:0;top:0;width:1080px;height:1060px;
  background:url(assets/filip.jpg) center 0%/cover;
  -webkit-mask-image:linear-gradient(#000 60%,transparent 100%);mask-image:linear-gradient(#000 60%,transparent 100%)}
#vig{left:0;top:0;width:1080px;height:1920px;
  background:linear-gradient(180deg,rgba(18,8,5,.85) 0%,rgba(18,8,5,0) 22%,rgba(18,8,5,0) 40%,rgba(18,8,5,.92) 62%,#120805 100%)}
.center{left:0;width:1080px;text-align:center}
#logo{top:70px;font-size:96px;letter-spacing:22px;font-weight:700;padding-left:22px}
#sub{top:190px;font-size:30px;letter-spacing:12px;color:var(--gold);padding-left:12px}
#live{top:950px;font-size:88px;font-style:italic;color:var(--gold)}
#filip{top:1020px;font-size:230px;font-weight:700;letter-spacing:6px;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#friends{top:1250px;font-size:78px;font-style:italic;color:var(--gold)}
#nov{top:1365px;font-size:42px;letter-spacing:14px;color:var(--cream);padding-left:14px}
.row{left:90px;width:900px;height:60px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(224,178,90,.35);font-size:44px}
.row .d{display:flex;gap:18px;align-items:baseline}
.row small{font-size:26px;letter-spacing:4px;color:var(--gold);width:190px}
.row b{font-weight:700}
.row .t{background:var(--olive);padding:4px 26px;border-radius:8px;font-size:40px;font-family:Georgia,serif;color:#fff}
#cta{top:1825px;font-size:50px;font-style:italic;color:var(--gold)}
#tags{top:1775px;font-size:26px;letter-spacing:6px;color:var(--cream);opacity:.85}
</style></head><body>
<div id="stage">
  <div id="photo" class="abs"></div>
  <div id="vig" class="abs"></div>
  <canvas id="gl" class="abs" width="1080" height="1920" style="display:none"></canvas>
  <div id="logo" class="abs center">PALOMA</div>
  <div id="sub" class="abs center">RESTAURANT · UTRECHT</div>
  <div id="live" class="abs center">Live muziek met</div>
  <div id="filip" class="abs center">FILIP</div>
  <div id="friends" class="abs center">&amp; Friends</div>
  <div id="nov" class="abs center">NOVEMBER</div>
  <div id="rows"></div>
  <div id="tags" class="abs center">GOEDE MUZIEK · LEKKER ETEN · FIJNE SFEER</div>
  <div id="cta" class="abs center">Kom genieten! ♥</div>
</div>
<script src="assets/three.min.js"></script>
<script>
const days=[["WOENSDAG","4 NOVEMBER","18:00"],["ZATERDAG","7 NOVEMBER","21:00"],["DONDERDAG","12 NOVEMBER","18:00"],["DINSDAG","17 NOVEMBER","18:00"],["DONDERDAG","26 NOVEMBER","18:00"]];
const rows=document.getElementById('rows');
days.forEach((d,i)=>{const e=document.createElement('div');e.className='row abs';e.style.top=(1430+i*66)+'px';
 e.innerHTML=`<div class="d"><small>${d[0]}</small><b>${d[1]}</b></div><div class="t">${d[2]}</div>`;rows.appendChild(e)});
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
// seek(t): t in seconds, total 9s. Statický plakát = seek(99)
// --- Three.js: zlaty prach + bokeh svetylka (deterministicke podle t) ---
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1080,1920,false);renderer.setClearColor(0,0);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(50,1080/1920,.1,100);cam.position.z=10;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function disc(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
 const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,230,160,1)');r.addColorStop(.35,'rgba(255,190,90,.55)');r.addColorStop(1,'rgba(255,160,60,0)');
 g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
function layer(n,size,seed){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
 const m=new THREE.PointsMaterial({map:disc(),size,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
 const p=new THREE.Points(geo,m);p.userData={n,seed};scene.add(p);return p}
const L=[layer(90,1.1,1),layer(160,.38,2),layer(120,.16,3)];
function updGL(t){
 L.forEach((p,k)=>{const {n,seed}=p.userData;const a=p.geometry.attributes.position.array;
  const sp=.35+k*.5;
  for(let i=0;i<n;i++){const r1=rnd(i+seed*1000),r2=rnd(i*3+seed*77),r3=rnd(i*7+seed*13);
   a[i*3]=(r1-.5)*14+Math.sin(t*.6+r2*6.28)*.4*(k+1);
   a[i*3+1]=((r2*16+t*sp)%16)-8;
   a[i*3+2]=(r3-.5)*8-k*1.5}
  p.geometry.attributes.position.needsUpdate=true;
  p.material.opacity=[.55,.9,1][k]*Math.min(1,t/1.2)*(0.8+0.2*Math.sin(t*3+k))});
 cam.position.x=Math.sin(t*.5)*.6;cam.position.y=Math.cos(t*.4)*.4;cam.lookAt(0,0,0);
 renderer.render(scene,cam)}
const bounce=x=>{x=Math.min(Math.max(x,0),1);const c=2.70158;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
function seek(t){
  const el=id=>document.getElementById(id);
  const inAt=(e,start,dur=.7,dy=60)=>{const p=bounce((t-start)/dur);e.style.opacity=Math.min(1,Math.max(0,(t-start)/.35));e.style.transform=`translateY(${(1-p)*dy}px)`};
  const ph=el('photo'),tt=Math.min(t,9);
  const BP=.418,B0=.18,ph0=((tt-B0)%BP+BP)%BP,punch=tt>B0?Math.exp(-ph0*9):0;
  const zz=tt/9,ez=zz*zz*(3-2*zz);
  ph.style.transform=`scale(${(1.0+.38*ez)*(1+.055*punch)}) translate(${Math.sin(tt*.9)*10}px,${-tt*6}px)`;
  inAt(el('logo'),.2);inAt(el('sub'),.5);inAt(el('live'),1.0);
  const f=el('filip'),p=bounce((t-1.4)/.9);f.style.opacity=Math.min(1,Math.max(0,(t-1.4)/.3));f.style.transform=`scale(${(1.5-.5*p)*(t>3?1+.025*punch:1)})`;
  const sh=(t>2.4&&t<4.4)?Math.sin((t-2.4)/2*Math.PI):0;
  f.style.filter=`brightness(${1+.35*sh}) drop-shadow(0 0 ${40*sh}px rgba(255,214,120,${.9*sh}))`;
  inAt(el('friends'),2.0);inAt(el('nov'),2.8);
  [...rows.children].forEach((r,i)=>inAt(r,3.2+i*.45,.6,50));
  inAt(el('tags'),5.8);
  const c=el('cta');inAt(c,6.4);if(t>7)c.style.transform=`scale(${1+.05*Math.sin((t-7)*6)})`;
  el('logo').style.textShadow=`0 0 ${20+14*Math.sin(t*2)}px rgba(224,178,90,.55)`;
}
seek(99);
</script></body></html>
